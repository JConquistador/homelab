name: homelab-proxy

services:

  caddy:
    image: homelab-caddy:2.11.9
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

    networks:
      - proxy
      
    
  caddy-private:
    image: homelab-caddy:2.11.9
    container_name: caddy-private
    restart: unless-stopped

    ports:
      - "127.0.0.1:8088:8080"

    volumes:
      - ./caddy/Caddyfile.private:/etc/caddy/Caddyfile:ro
      - caddy-private-data:/data
      - caddy-private-config:/config

    networks:
      - frontend
      - media


volumes:

  caddy-data:
  caddy-config:
  caddy-private-data:
  caddy-private-config:


networks:

  proxy:
    external: true
    name: homelab-proxy-network
  
  frontend:
    external: true
    name: frontend

  media:
    external: true
    name: homelab-media-network
