name: homelab-proxy

services:

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

    networks:
      - proxy


volumes:

  caddy-data:
  caddy-config:


networks:

  proxy:
    external: true
    name: homelab-proxy-network
