name: homelab-proxy

services:

  caddy:
    image: homelab-caddy:2.11.9
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

    networks:
      - proxy


volumes:

  caddy-data:
  caddy-config:


networks:

  proxy:
    external: true
    name: homelab-proxy-network
