name: homelab-infrastructure

services:

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}      
    ports:
      - "3000:3000"
    volumes:
      - ${HOMELAB_ROOT}/appdata/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontend

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ${HOMELAB_ROOT}/appdata/uptime-kuma:/app/data
    networks:
      - frontend
      - monitoring
  
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1
    container_name: cloudflare-ddns
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      IP4_DOMAINS: request.auroradorhq.com,watch.auroradorhq.com
      IP6_PROVIDER: none
      PROXIED: 'is(request.auroradorhq.com)'
      TZ: ${TZ}

networks:

  frontend:
    external: true

  monitoring:
    external: true
    name: monitoring