name: homelab-media

services:

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun
    
    ports:
      - 8080:8080

    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES}

    volumes:
      - ${HOMELAB_ROOT}/appdata/gluetun:/gluetun

    networks:
      - vpn

    restart: unless-stopped
  
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent

    network_mode: "service:gluetun"

    depends_on:
      - gluetun

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8080

    volumes:
      - ${HOMELAB_ROOT}/appdata/qbittorrent:/config
      - ${HOMELAB_ROOT}/downloads/qbittorrent:/downloads

    restart: unless-stopped


networks:

  media:
    name: homelab-media-network

  vpn:
    name: homelab-vpn-network